name: MyImage

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [ labeled, unlabeled, opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      packages: write  # for pushing packages to GHCR, which is used by cd.apps.n9.io to avoid polluting Quay with tags
    runs-on: ubuntu-24.04
    steps:
      # full history, so that Go can derive the main module version from the nearest version tag
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The fork does not carry all upstream release tags. Without them Go stamps the binary
      # with v3.0.0-<date>-<sha> instead of e.g. v3.5.8-0.<date>-<sha> (seen by vulnerability scanners).
      - name: Fetch upstream version tags
        run: git fetch --force --no-recurse-submodules https://github.com/argoproj/argo-cd.git 'refs/tags/v*:refs/tags/v*'

      - name: Set up image tags
        id: image
        run: |
          echo "tag=$(cat ./VERSION)-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "shorttag=$(cat ./VERSION)" >> $GITHUB_OUTPUT

      - name: Set up build args for container image
        run: |
          echo "GIT_TAG=$(if [ -z "`git status --porcelain`" ]; then git describe --exact-match --tags HEAD 2>/dev/null; fi)" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "GIT_TREE_STATE=$(if [ -z "`git status --porcelain`" ]; then echo "clean" ; else echo "dirty"; fi)" >> $GITHUB_ENV

      # .dockerignore leaves out tracked files (test/, hack/, docs/, ...), so `git status` in the build
      # context reports them as deleted and Go appends "+dirty" to the version. The checkout is fresh
      # (GIT_TREE_STATE above is computed before this step), so tell git not to look at tracked files.
      - name: Hide files left out by .dockerignore from git status
        run: git ls-files -z | xargs -0 git update-index --skip-worktree

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/n9/argo-cd/argocd:${{ steps.image.outputs.tag }}
            ghcr.io/n9/argo-cd/argocd:${{ steps.image.outputs.shorttag }}
          provenance: false
          sbom: false
          build-args: |
            GIT_TAG=${{env.GIT_TAG}}
            GIT_COMMIT=${{env.GIT_COMMIT}}
            BUILD_DATE=${{env.BUILD_DATE}}
            GIT_TREE_STATE=${{env.GIT_TREE_STATE}}
